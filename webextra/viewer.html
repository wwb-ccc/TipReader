<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/tb.png" />
<title>TipReader 被控端</title>
<style>
    html, body { margin:0; height:100%; background:transparent !important; overflow:hidden; font-family:"Microsoft YaHei",sans-serif; user-select:none; }
    #lines { height:100%; overflow:hidden; padding:6px 10px; display:flex; flex-direction:column; }
    .script-line { color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.8); line-height:1.3; white-space:pre-wrap; word-break:break-word; }
    .script-line.blank { opacity:0; pointer-events:none; }
    .script-line.read,.script-line.current { color:#ff0000; }
    #status { position:absolute; left:8px; bottom:6px; color:#9cf; font-size:12px; text-shadow:0 0 3px rgba(0,0,0,.9); }
</style>
</head>
<body>
<div style="position:absolute;inset:0;background:transparent"></div>
<div id="lines"></div>
<div id="status"></div>
<script>
(function(){
  var linesEl = document.getElementById('lines');
  var statusEl = document.getElementById('status');
  var state = null, last = "";
  var ratio = 0.45;

  function hexColor(c){ return c || '#fff'; }

  function renderTop(){
    var target = document.querySelector('.script-line[data-id="'+state.cursor+'"]');
    if(!target) return;
    var off = target.offsetTop - linesEl.clientHeight*ratio + target.offsetHeight/2;
    // 被控端：不允许用户滚动，仅跟随控制端
    linesEl.scrollTop = Math.max(0, off);
    Array.prototype.forEach.call(linesEl.children, function(r){ r.scrollIntoView && undefined; });
  }
  function render(s){
    state = s; if(!state) return;
    var st = state.settings || {};
    var text = hexColor(st.textColor), read = hexColor(st.readColor);
    var hash = JSON.stringify({ids:(state.lines||[]).map(function(l){return l.id;}),c:state.cursor});
    if(hash !== last){
      last = hash;
      linesEl.innerHTML='';
      var frag=document.createDocumentFragment();
      (state.lines||[]).forEach(function(line){
        var d=document.createElement('div');
        if(line.id<0){ d.className='script-line blank'; }
        else{
          d.className='script-line'+(line.id<=state.cursor?(line.id===state.cursor?' current':' read'):'');
          d.dataset.id=line.id;
          d.textContent=line.text;
          d.style.fontSize=(st.fontSize||32)+'px';
          d.style.color=(line.id<=state.cursor)?read:text;
        }
        frag.appendChild(d);
      });
      linesEl.appendChild(frag);
    }
    renderTop();
  }

  var ws = null;
  function connect(){
    var proto = location.protocol==='https:'?'wss://':'ws://';
    ws = new WebSocket(proto + location.host + '/ws');
    ws.onopen = function(){ statusEl.textContent='已连接'; };
    ws.onmessage = function(ev){ try{ var m=JSON.parse(ev.data); if(m.type==='state'&&m.state) render(m.state); }catch(e){} };
    ws.onclose = function(){ statusEl.textContent='连接断开，重连中…'; setTimeout(connect, 1500); };
    ws.onerror = function(){ try{ws.close();}catch(e){} };
  }
  // 阻止用户滚动/改行（被控端）
  window.addEventListener('wheel', function(e){ e.preventDefault(); }, {passive:false});
  window.addEventListener('keydown', function(e){
    if(['ArrowDown','ArrowUp','PageDown','PageUp','Home','End',' '].indexOf(e.key)>=0) e.preventDefault();
  });
  window.addEventListener('resize', renderTop);
  connect();
})();
</script>
</body>
</html>
